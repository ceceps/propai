[project]
name = "propai-worker"
version = "0.1.0"
description = "PropAI background worker: content generation pipeline jobs"
requires-python = ">=3.12"
dependencies = [
    "propai-core",
    "rq>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/propai_worker"]

[tool.uv.sources]
propai-core = { path = "../../packages/propai_core", editable = true }
