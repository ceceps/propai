[project]
name = "propai-dashboard"
version = "0.1.0"
description = "PropAI internal agent console"
requires-python = ">=3.12"
dependencies = [
    "propai-core",
    "streamlit>=1.40.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/propai_dashboard"]

[tool.uv.sources]
propai-core = { path = "../../packages/propai_core", editable = true }
