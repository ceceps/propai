[project]
name = "propai-api"
version = "0.1.0"
description = "PropAI HTTP API: auth, listings, public landing pages, webhooks"
requires-python = ">=3.12"
dependencies = [
    "propai-core",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.17",
    "jinja2>=3.1.4",
    "email-validator>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/propai_api"]

[tool.uv.sources]
propai-core = { path = "../../packages/propai_core", editable = true }
